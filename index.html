<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANDÉN 1609 - Radio en Vivo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0f0f0f;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      user-select: none;
    }
    .card {
      text-align: center;
      width: 100%;
    }
    .logo {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 6px;
      color: #ffffff;
    }
    .status {
      font-size: 12px;
      color: #ff3b30;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-weight: 500;
    }
    .dot {
      width: 8px;
      height: 8px;
      background-color: #ff3b30;
      border-radius: 50%;
      box-shadow: 0 0 8px #ff3b30;
    }
    audio {
      width: 100%;
      height: 40px;
      filter: invert(0.9) hue-rotate(180deg);
      outline: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="logo">ANDÉN 1609</div>
    <div class="status"><span class="dot"></span> EN VIVO</div>
    
    <!-- Tu stream directo cargado aquí -->
    <audio src="https://devnec.com:8001/radio060" autoplay controls></audio>
  </div>

</body>
</html>
